services:
  postgres:
    image: postgres:16
    container_name: cloud-monitor-db
    environment:
      POSTGRES_DB: cloudmonitor
      POSTGRES_USER: cloudmonitor
      POSTGRES_PASSWORD: cloudmonitor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  localstack_data: